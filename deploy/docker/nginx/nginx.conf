# ============================================================
# QuickBlue 前端 Nginx 配置
# 前端静态资源位于 /usr/share/nginx/html/admin（vite base=/admin）
# API 请求 /api 反向代理到网关服务
# ============================================================
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 字符集与请求体大小（支持大文件上传，与后端 100MB 对齐）
    charset utf-8;
    client_max_body_size 200m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1k;
    # 直接使用构建期生成的 .gz 预压缩文件（P1 优化），命中后不再动态压缩
    gzip_static on;
    gzip_vary on;

    # 根路径跳转到管理后台
    # 用 $http_host（原始 Host 头，保留端口），避免 $server_port 在 Docker 映射后
    # 变成容器内端口 80，导致相对路径重定向丢失 8088 而 404
    location = / {
        return 301 $scheme://$http_host/admin/;
    }

    # 管理后台（vite base=/admin，静态资源 + SPA 路由回退）
    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
    }

    # SPA 入口禁止缓存。
    # 不加这条时 nginx 对 .html 不发 Cache-Control，浏览器会按启发式缓存 index.html：
    # 重建镜像后浏览器仍用旧入口，继续引用已不存在的旧 chunk，表现就是
    # 「代码改了、镜像也重建了，报错却一模一样」——排查时极容易被误导成"没生效"。
    # try_files 的内部跳转会重新匹配 location，因此 /admin/ 下的路由回退也走这里。
    location = /admin/index.html {
        add_header Cache-Control "no-store, must-revalidate";
        add_header Pragma "no-cache";
    }

    # 带 hash 的构建产物可以长缓存：文件名变了才会换 URL，不存在读旧文件的问题
    location /admin/js/ {
        add_header Cache-Control "public, max-age=2592000, immutable";
    }
    location /admin/css/ {
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # API 代理到网关
    location /api/ {
        proxy_pass http://quickblue-gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # AI 对话/流式响应需要较长超时
        proxy_connect_timeout 60s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        # SSE 流式支持
        proxy_buffering off;
        proxy_cache off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # 监控端点代理
    location /actuator {
        proxy_pass http://quickblue-gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ============================================================
    # 微服务 API 文档（Knife4j）统一入口
    # ------------------------------------------------------------
    # 为什么必须由前端 nginx 反代，而不是让前端直接跳到网关 8080：
    #   网关自带的文档门户页面（GatewayIndexController 提供的 /api/services/overview
    #   + static/index.html）里的卡片链接是【根路径相对】的 /QuickBlue-xxx/doc.html，
    #   文档页后续还会请求 /QuickBlue-xxx/v3/api-docs/**、/QuickBlue-xxx/webjars/**。
    #   若门户与这些链接不在同一个源，就会跨端口/404，表现为"文档入口打不开"。
    #   因此这里把「门户页面」和「文档前缀」都反代到网关，保持全程同源。
    #
    # 注：/api/services/overview 走上面的 location /api/ 已可正常到达网关。
    # ============================================================

    # 文档门户：/docs -> 网关根路径（网关 IndexWebFilter 返回自带聚合页）
    # 末尾的 / 不可省：proxy_pass 带路径时会把 location 匹配到的前缀替换为它
    location = /docs {
        return 301 $scheme://$http_host/docs/;
    }
    location /docs/ {
        proxy_pass http://quickblue-gateway:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 各微服务文档前缀：/QuickBlue-xxx/doc.html、/v3/api-docs、/webjars 等
    # proxy_pass 末尾【不能】带 /，否则会剥掉 /QuickBlue-xxx 前缀，网关就匹配不到文档路由了
    location /QuickBlue- {
        proxy_pass http://quickblue-gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;
    }

    # 静态资源缓存（带 hash 的资源长缓存）
    location /admin/assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
