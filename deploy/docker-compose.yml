# ============================================================
# QuickBlue-MicroAI（MySQL 版）Docker 一键部署编排
# ------------------------------------------------------------
# 使用（所有命令在 deploy/ 目录下执行）:
#   cp .env.example .env           首次部署前准备环境变量
#   bash build.sh --all            全量：构建全部镜像 + 分层启动（首次部署用）
#   bash build.sh system frontend  只重建/重启指定服务（支持短名）
#   bash scripts/start-staged.sh   只启动（镜像已存在时，如整机重启后）
#
# 服务清单:
#   基础设施: mysql / redis / nacos / nacos-init（一次性，导入配置后退出）
#   后端:     gateway(8080) / system(8081) / business(8082)
#             support(8083) / ai(8084) / admin(9090)
#   前端:     frontend(8088 -> nginx 80)
#   可选:     ollama / ollama-init（--profile ollama，AI 知识库本地嵌入模型）
#
# 说明:
#   - 后端全部容器内 Maven 多阶段构建，宿主机只需 Docker，无需 JDK/Maven
#   - Nacos 用 v2.4.3，与后端 client 版本一致（最稳组合）
#   - MySQL 首次启动自动建库 + 导入 database/mysql/01~05 全部脚本
#   - nacos-init 自动导入 nacos_config/common + services 全部配置
# ============================================================
name: quickblue

networks:
  quickblue-net:
    driver: bridge

volumes:
  mysql-data:
    name: quickblue-mysql-data
  redis-data:
    name: quickblue-redis-data
  nacos-data:
    name: quickblue-nacos-data
  nacos-logs:
    name: quickblue-nacos-logs
  uploads:
    name: quickblue-uploads
  ollama-data:
    name: quickblue-ollama-data

# 后端服务公共配置
x-app-base: &app-base
  restart: unless-stopped
  networks:
    - quickblue-net
  env_file:
    - .env
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"

services:
  # ==================== 基础设施 ====================
  mysql:
    image: mysql:8.0
    container_name: quickblue-mysql
    restart: unless-stopped
    mem_limit: 1g
    cpus: '1.5'
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: ${TZ:-Asia/Shanghai}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --default-time-zone=+08:00
      - --max-connections=500
    ports:
      - "3306:3306"
    networks:
      - quickblue-net
    volumes:
      - mysql-data:/var/lib/mysql
      # SQL 脚本只读挂载（init 脚本从 /sql 读取）
      - ../database/mysql:/sql:ro
      # 首次启动自动执行（docker-entrypoint-initdb.d 机制）
      - ./docker/init/init-mysql.sh:/docker-entrypoint-initdb.d/01-init-mysql.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  redis:
    image: redis:7-alpine
    container_name: quickblue-redis
    restart: unless-stopped
    mem_limit: 512m
    cpus: '0.5'
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    networks:
      - quickblue-net
    volumes:
      - redis-data:/data
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a '$${REDIS_PASSWORD}' ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 12

  nacos:
    image: nacos/nacos-server:v2.4.3
    container_name: quickblue-nacos
    restart: unless-stopped
    mem_limit: 768m
    cpus: '1.0'
    environment:
      MODE: standalone
      JVM_XMS: 512m
      JVM_XMX: 512m
      JVM_XMN: 256m
      TZ: ${TZ:-Asia/Shanghai}
      # 内网部署关闭鉴权（与 .env 的 NACOS_USERNAME/PASSWORD 留空对应）。
      # 生产开启时改为 true，并配置 NACOS_AUTH_TOKEN（.env 覆盖）等三项，
      # 同时 .env 填入 Nacos 管理员账号
      NACOS_AUTH_ENABLE: "false"
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:-QuickBlueDefaultTokenPleaseChangeMeInProduction==}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY:-serverIdentity}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE:-security}
      PREFER_HOST_MODE: hostname
    ports:
      - "8848:8848"   # 控制台与 OpenAPI（nacos/nacos）
      - "9848:9848"   # gRPC 客户端长连接（映射后便于 IDE 直连调试）
    networks:
      - quickblue-net
    volumes:
      - nacos-data:/home/nacos/data
      - nacos-logs:/home/nacos/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8848/nacos/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  # Nacos 配置导入（一次性任务，完成后自动退出）
  # 导入 nacos_config/common/*.yaml（共享配置）+ services/*.yaml（各服务配置）
  quickblue-nacos-init:
    image: python:3.12-alpine
    container_name: quickblue-nacos-init
    restart: "no"
    mem_limit: 128m
    depends_on:
      nacos:
        condition: service_healthy
    environment:
      NACOS_ADDR: nacos:8848
      NACOS_NAMESPACE: ${NACOS_NAMESPACE:-QuickBlue-dev}
      NACOS_GROUP: ${NACOS_GROUP:-QuickBlue_GROUP}
      # 鉴权关闭时留空（脚本自动跳过登录）；开启鉴权时填管理员账号
      NACOS_USERNAME: ${NACOS_USERNAME:-}
      NACOS_PASSWORD: ${NACOS_PASSWORD:-}
    networks:
      - quickblue-net
    volumes:
      - ./docker/init/import-nacos.py:/app/import-nacos.py:ro
      - ../nacos_config:/config:ro
    command: ["sh", "-c", "cd /app && python import-nacos.py"]

  # ==================== 后端微服务 ====================
  # 启动类所在 jar 由容器内 Maven 构建（见 ../docker/Dockerfile.app）
  quickblue-gateway:
    <<: *app-base
    build:
      context: ..
      dockerfile: docker/Dockerfile.app
      args:
        MODULE: QuickBlue-gateway
        JAR_NAME: QuickBlue-gateway-4.0.0.jar
    image: quickblue-gateway:4.0.0
    container_name: quickblue-gateway
    environment:
      JAVA_OPTS: "-Xms256m -Xmx512m -XX:MaxMetaspaceSize=256m"
      # ⚠️ 密钥含 $ 字符，必须用 $$ 转义（compose 插值规则），不能放 .env
      SM4_ENCRYPT_KEY: "A3f$$7cLp#2mN8!zQ"
    ports:
      - "8080:8080"
    networks:
      - quickblue-net
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s

  quickblue-system:
    <<: *app-base
    build:
      context: ..
      dockerfile: docker/Dockerfile.app
      args:
        MODULE: QuickBlue-modules/QuickBlue-system
        JAR_NAME: QuickBlue-system-4.0.0.jar
    image: quickblue-system:4.0.0
    container_name: quickblue-system
    environment:
      JAVA_OPTS: "-Xms256m -Xmx512m -XX:MaxMetaspaceSize=256m"
      # ⚠️ 密钥含 $ 字符，必须用 $$ 转义（compose 插值规则），不能放 .env
      SM4_ENCRYPT_KEY: "A3f$$7cLp#2mN8!zQ"
    ports:
      - "8081:8081"
    networks:
      - quickblue-net
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/actuator/health/readiness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s

  quickblue-business:
    <<: *app-base
    build:
      context: ..
      dockerfile: docker/Dockerfile.app
      args:
        MODULE: QuickBlue-modules/QuickBlue-business
        JAR_NAME: QuickBlue-business-4.0.0.jar
    image: quickblue-business:4.0.0
    container_name: quickblue-business
    environment:
      JAVA_OPTS: "-Xms256m -Xmx512m -XX:MaxMetaspaceSize=256m"
      # ⚠️ 密钥含 $ 字符，必须用 $$ 转义（compose 插值规则），不能放 .env
      SM4_ENCRYPT_KEY: "A3f$$7cLp#2mN8!zQ"
      REDIS_DATABASE: "3"   # business 服务使用独立 Redis 库
    ports:
      - "8082:8082"
    networks:
      - quickblue-net
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8082/actuator/health/readiness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s

  quickblue-support:
    <<: *app-base
    build:
      context: ..
      dockerfile: docker/Dockerfile.app
      args:
        MODULE: QuickBlue-modules/QuickBlue-support
        JAR_NAME: QuickBlue-support-4.0.0.jar
    image: quickblue-support:4.0.0
    container_name: quickblue-support
    environment:
      JAVA_OPTS: "-Xms256m -Xmx512m -XX:MaxMetaspaceSize=256m"
      # ⚠️ 密钥含 $ 字符，必须用 $$ 转义（compose 插值规则），不能放 .env
      SM4_ENCRYPT_KEY: "A3f$$7cLp#2mN8!zQ"
    ports:
      - "8083:8083"
    networks:
      - quickblue-net
    volumes:
      # 本地文件存储持久化（support 文件管理模块上传的附件）
      - uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/actuator/health/readiness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s

  quickblue-ai:
    <<: *app-base
    build:
      context: ..
      dockerfile: docker/Dockerfile.app
      args:
        MODULE: QuickBlue-modules/QuickBlue-ai
        JAR_NAME: QuickBlue-ai-4.0.0.jar
    image: quickblue-ai:4.0.0
    container_name: quickblue-ai
    mem_limit: 2g
    cpus: '1.5'
    environment:
      JAVA_OPTS: "-Xms512m -Xmx1g -XX:MaxMetaspaceSize=256m"
      # ⚠️ 密钥含 $ 字符，必须用 $$ 转义（compose 插值规则），不能放 .env
      SM4_ENCRYPT_KEY: "A3f$$7cLp#2mN8!zQ"
    ports:
      - "8084:8084"
    networks:
      - quickblue-net
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8084/actuator/health/readiness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s

  quickblue-admin:
    <<: *app-base
    build:
      context: ..
      dockerfile: docker/Dockerfile.app
      args:
        MODULE: QuickBlue-admin
        JAR_NAME: QuickBlue-admin-4.0.0.jar
    image: quickblue-admin:4.0.0
    container_name: quickblue-admin
    mem_limit: 768m
    cpus: '0.5'
    environment:
      JAVA_OPTS: "-Xms128m -Xmx256m -XX:MaxMetaspaceSize=128m"
      # ⚠️ 密钥含 $ 字符，必须用 $$ 转义（compose 插值规则），不能放 .env
      SM4_ENCRYPT_KEY: "A3f$$7cLp#2mN8!zQ"
    ports:
      - "9090:9090"
    networks:
      - quickblue-net
    depends_on:
      nacos-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9090/actuator/health/readiness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s

  # ==================== 前端 ====================
  frontend:
    build:
      context: ../../QuickBule-MicroAI-web
      dockerfile: docker/Dockerfile.frontend
    image: quickblue-frontend:4.0.0
    container_name: quickblue-frontend
    restart: unless-stopped
    mem_limit: 512m
    cpus: '0.5'
    networks:
      - quickblue-net
    ports:
      - "8088:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      quickblue-gateway:
        condition: service_healthy

  # ==================== 可选：Ollama 本地嵌入模型 ====================
  # AI 知识库向量化默认可用云端 API；要完全离线时启用本 profile：
  #   docker compose --profile ollama up -d
  # 然后在管理后台 AI 模型配置中把嵌入模型地址填 http://nacos 所在宿主IP:11434
  # （或 http://ollama:11434，容器网络内可达）
  ollama:
    profiles: ["ollama"]
    image: ollama/ollama:0.11.4
    container_name: quickblue-ollama
    restart: unless-stopped
    mem_limit: 4g
    cpus: '2.0'
    environment:
      OLLAMA_HOST: 0.0.0.0
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "11434:11434"
    networks:
      - quickblue-net
    volumes:
      # 模型文件持久化（数 GB，不持久化则重建容器后需重新拉取）
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  # Ollama 模型预拉取（一次性任务，配合 --profile ollama 使用）
  ollama-init:
    profiles: ["ollama"]
    image: ollama/ollama:0.11.4
    container_name: quickblue-ollama-init
    restart: "no"
    mem_limit: 512m
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
    networks:
      - quickblue-net
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo "[ollama-init] 开始拉取模型: $$OLLAMA_EMBED_MODEL"
        ollama pull "$$OLLAMA_EMBED_MODEL"
        echo "[ollama-init] 已就绪:"
        ollama list
