server:
  port: 8080

spring:
  application:
    name: QuickBlue-gateway
  profiles:
    active: dev
  config:
    import: optional:nacos
  # 排除 DataSource 自动配置（安装服务不需要使用 Spring 的 DataSource）
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
  # WebFlux 静态资源配置
  webflux:
    static-path-pattern: /**
    resources:
      static-locations: classpath:/static/
  # Redis配置（用于安装向导的Redis健康检查）
  # 注意：这些配置仅在安装前进行Redis连接测试时使用
  # 实际Redis连接配置会在安装后通过Nacos配置中心下发到各微服务
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:budaos}
      database: ${REDIS_DATABASE:1}
      timeout: 10000ms
      lettuce:
        pool:
          min-idle: 5
          max-idle: 10
          max-active: 20
          max-wait: -1ms
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        # Gateway 自身的路由（安装、环境管理）- 放在最前面，避免被其他路由匹配
        - id: gateway-local
          uri: http://127.0.0.1:8080
          predicates:
            - Path=/api/install/**, /api/environment/**
          filters:
            - StripPrefix=1

        # System Service - Login routes
        - id: QuickBlue-system-login
          uri: lb://QuickBlue-system
          predicates:
            - Path=/api/login/**
          filters:
            - StripPrefix=1
        # System Service
        - id: QuickBlue-system
          uri: lb://QuickBlue-system
          predicates:
            - Path=/api/system/**
          filters:
            - StripPrefix=2
        # Business Service
        - id: QuickBlue-business
          uri: lb://QuickBlue-business
          predicates:
            - Path=/api/business/**
          filters:
            - StripPrefix=2
        # Business Service - OA
        - id: QuickBlue-business-oa
          uri: lb://QuickBlue-business
          predicates:
            - Path=/api/oa/**
          filters:
            - StripPrefix=2
        # AI Service
        - id: QuickBlue-ai
          uri: lb://QuickBlue-ai
          predicates:
            - Path=/api/ai/**
          filters:
            - RewritePath=/api/ai/(?<segment>.*), /ai/${segment}
        # Support Service (通用路由放在最后)
        - id: QuickBlue-support
          uri: lb://QuickBlue-support
          predicates:
            - Path=/api/support/**
          filters:
            - StripPrefix=2
      # 全局跨域配置（只在 YAML 中配置，避免与 Java 配置冲突）
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - PATCH
            allowedHeaders: "*"
            allowCredentials: true
            exposedHeaders: "*"
            maxAge: 3600

# 日志配置
logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: DEBUG
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n'

# 管理端点
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,gateway,env,loggers
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
    gateway:
      access: readonly
  metrics:
    tags:
      application: ${spring.application.name}

  # Spring Boot Admin 客户端配置
  boot:
    admin:
      client:
        enabled: true
        url: http://localhost:9090
        instance:
          prefer-ip: true
          service-url: http://${spring.cloud.client.ip-address}:${server.port}

# 网关自定义配置
gateway:
  custom:
    whitelist:
      - /login
      - /login/**
      - /api/login/**
      - /captcha
      - /api/captcha
      - /favicon.ico
      - /api/support/files/**
      - /api/support/public/**
      - /api/support/job/**
      # 安装向导白名单（需要包括路由处理前后的路径）
      - /api/install/**
      - /install/**
      # 环境管理白名单
      - /api/environment/**
      - /environment/**
      # Knife4j API 文档白名单
      - /doc.html
      - /swagger-resources/**
      - /v3/api-docs
      - /v3/api-docs/**
      - /v3/api-docs/default
      - /webjars/**
      - /swagger-ui/**
      - /swagger-ui.html
      # 各微服务 API 文档白名单（完整路径）
      - /
      - /index.html
      - /api/services/overview
      - /QuickBlue-system/**
      - /QuickBlue-business/**
      - /QuickBlue-support/**
      - /QuickBlue-ai/**
      - /api-docs/services
      - /api-docs/health
      - /api-docs/aggregated
      - /swagger-resources

# 网关不生成 API 文档，只提供路由和静态聚合页面

