<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickBlue API 文档中心</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            width: 100%;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 50px;
            animation: fadeInDown 0.8s ease-out;
        }

        .header h1 {
            font-size: 48px;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 18px;
            opacity: 0.9;
        }

        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }

        .service-card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
            animation: fadeInUp 0.6s ease-out;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .service-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }

        .service-card:nth-child(1) { animation-delay: 0.1s; }
        .service-card:nth-child(2) { animation-delay: 0.2s; }
        .service-card:nth-child(3) { animation-delay: 0.3s; }
        .service-card:nth-child(4) { animation-delay: 0.4s; }

        .service-icon {
            width: 60px;
            height: 60px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            font-size: 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .service-name {
            font-size: 24px;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }

        .service-description {
            color: #666;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .service-links {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .service-link {
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s ease;
            display: inline-block;
        }

        .link-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .link-primary:hover {
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
            transform: translateY(-2px);
        }

        .link-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .link-secondary:hover {
            background: #e0e0e0;
            transform: translateY(-2px);
        }

        .status-section {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            animation: fadeInUp 0.8s ease-out;
        }

        .status-title {
            font-size: 24px;
            font-weight: bold;
            color: #333;
            margin-bottom: 20px;
        }

        .status-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .status-item {
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            text-align: center;
        }

        .status-label {
            color: #666;
            font-size: 14px;
            margin-bottom: 5px;
        }

        .status-value {
            font-size: 20px;
            font-weight: bold;
            color: #333;
        }

        .status-online {
            color: #43e97b;
        }

        .footer {
            text-align: center;
            color: white;
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.2);
            animation: fadeIn 1s ease-out;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .loading {
            text-align: center;
            color: white;
            font-size: 18px;
            padding: 40px;
        }

        .error-message {
            background: rgba(255, 255, 255, 0.95);
            color: #d32f2f;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 QuickBlue API 文档中心</h1>
            <p>统一访问所有微服务的 API 接口文档</p>
        </div>

        <div id="services-container" class="services-grid">
            <div class="loading">正在加载服务列表...</div>
        </div>

        <div class="status-section">
            <h2 class="status-title">📊 服务状态</h2>
            <div class="status-grid" id="status-grid">
                <div class="status-item">
                    <div class="status-label">网关服务</div>
                    <div class="status-value status-online">运行中</div>
                </div>
                <div class="status-item">
                    <div class="status-label">已注册服务数</div>
                    <div class="status-value" id="service-count">-</div>
                </div>
                <div class="status-item">
                    <div class="status-label">文档版本</div>
                    <div class="status-value">v4.0.0</div>
                </div>
            </div>
        </div>

        <div class="footer">
            <p>Powered by Spring Cloud Gateway & Knife4j</p>
            <p>© 2026 QuickBlue Platform</p>
        </div>
    </div>

    <script>
        // 动态加载服务列表
        async function loadServices() {
            try {
                const response = await fetch('/api/services/overview');
                if (!response.ok) {
                    throw new Error('服务列表加载失败');
                }

                const data = await response.json();
                renderServices(data);
                updateServiceCount(data.count);
            } catch (error) {
                console.error('加载服务失败:', error);
                document.getElementById('services-container').innerHTML =
                    '<div class="error-message">⚠️ 加载服务列表失败，请稍后重试</div>';
            }
        }

        function renderServices(data) {
            const container = document.getElementById('services-container');
            const services = data.services || {};

            if (Object.keys(services).length === 0) {
                container.innerHTML = '<div class="error-message">⚠️ 暂无可用服务</div>';
                return;
            }

            const serviceIcons = {
                'QuickBlue-system': '⚙️',
                'QuickBlue-business': '💼',
                'QuickBlue-support': '🔧',
                'QuickBlue-ai': '🤖'
            };

            const serviceDescriptions = {
                'QuickBlue-system': '系统管理、用户权限、角色配置等核心功能',
                'QuickBlue-business': '业务流程、订单管理、数据处理等功能',
                'QuickBlue-support': '文件服务、任务调度、公共支撑服务',
                'QuickBlue-ai': '人工智能、机器学习、智能推荐等服务'
            };

            let html = '';
            for (const [serviceName, serviceInfo] of Object.entries(services)) {
                const icon = serviceInfo.icon || '📦';
                const description = serviceInfo.description || '微服务';
                const displayName = serviceInfo.displayName || serviceName;

                html += `
                    <a href="${serviceInfo.docHtmlUrl}" class="service-card" target="_blank">
                        <div class="service-icon">
                            ${icon}
                        </div>
                        <div class="service-name">${displayName}</div>
                        <div class="service-description">${description}</div>
                        <div class="service-links">
                            <span class="service-link link-primary">查看 API 文档</span>
                            <span class="service-link link-secondary">OpenAPI: ${serviceInfo.apiDocsUrl}</span>
                        </div>
                    </a>
                `;
            }

            container.innerHTML = html;
        }

        function updateServiceCount(count) {
            const countElement = document.getElementById('service-count');
            if (countElement) {
                countElement.textContent = count;
            }
        }

        // 页面加载完成后执行
        document.addEventListener('DOMContentLoaded', loadServices);
    </script>
</body>
</html>
