# System 服务配置

spring:
  application:
    name: QuickBlue-system
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/quickblue_system?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:budaos}
  cache:
    type: caffeine
  cloud:
    nacos:
      discovery:
        metadata:
          version: 4.0.0
          environment: dev
          port: 8081
      config:
        shared-configs:
          - data-id: level3-protect-common.yaml
            group: QuickBlue_GROUP
            refresh: true

server:
  port: 8081

feign:
  httpclient:
    enabled: false
  okhttp:
    enabled: true
  client:
    config:
      default:
        connect-timeout: 10000
        read-timeout: 30000
        logger-level: basic
  compression:
    request:
      enabled: true
      mime-types: application/json,application/xml,text/plain
      min-request-size: 1024
    response:
      enabled: true
      mime-types: application/json,application/xml

system:
  config:
    token-expire: 2592000
    max-login-attempts: 5
    lock-time: 30

logging:
  level:
    feign: INFO
    okhttp3: INFO
