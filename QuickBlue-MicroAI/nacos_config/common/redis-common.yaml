# Redis 通用配置（所有服务共享，通过环境变量统一管理地址）
# 修改 Redis 地址只需设置环境变量：REDIS_HOST / REDIS_PORT / REDIS_PASSWORD / REDIS_DATABASE
spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:budaos}
      database: ${REDIS_DATABASE:1}
      timeout: 10s
      lettuce:
        pool:
          min-idle: 5
          max-idle: 10
          max-active: 20
          max-wait: -1ms
  cache:
    type: redis
    redis:
      time-to-live: 3600s
      cache-null-values: false
      use-key-prefix: true
      key-prefix: "QuickBlue:"

# Redisson 配置
redisson:
  address: redis://${REDIS_HOST:localhost}:${REDIS_PORT:6379}
  password: ${REDIS_PASSWORD:budaos}
  database: ${REDIS_DATABASE:1}
  connection-pool-size: 10
  connection-minimum-idle-size: 5
  idle-connection-timeout: 10000
  connect-timeout: 10000
  timeout: 3000
  retry-attempts: 3
  retry-interval: 1500
